AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Clean Hacker News - top stories of the week with AI summaries, static site, synced archive.

Parameters:
  GeminiModel:
    Type: String
    Default: gemini-flash-latest
    Description: Gemini model or alias. The default alias tracks Google's newest Flash model.
  GeminiFallbackModel:
    Type: String
    Default: gemini-flash-lite-latest
    Description: Backup model used when the main one is out of quota, rate limited, or slow.
  GeminiKeyParam:
    Type: String
    Default: /hn-reader/gemini-api-key
    Description: SSM SecureString holding the Gemini API key.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]

Resources:
  # ---------- Storage ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # The summary cache is internal; never serve it.
          - Effect: Deny
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/cache/*

  ArchiveTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------- Hourly refresh ----------
  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ # per function: `aws cloudformation package` ignores Globals.CodeUri
      Handler: refresh.handler
      MemorySize: 512
      Timeout: 900
      Environment:
        Variables:
          BUCKET: !Ref SiteBucket
          GEMINI_MODEL: !Ref GeminiModel
          GEMINI_FALLBACK_MODEL: !Ref GeminiFallbackModel
          GEMINI_KEY_PARAM: !Ref GeminiKeyParam
          # Reading pool: the 150 highest-voted stories of the past 7 days, ranked by points alone.
          # Unread stories stay in the inbox until they are older than the window.
          TOP_N: '150'
          WINDOW_DAYS: '7'
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SiteBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GeminiKeyParam}
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            RetryPolicy:
              MaximumRetryAttempts: 0

  # ---------- Archive API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE: !Ref ArchiveTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArchiveTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  # ---------- CDN ----------
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HN reader
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  RefreshFunctionName:
    Value: !Ref RefreshFunction
