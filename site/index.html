<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HN Brief</title>
  <meta name="description" content="The week’s most-voted Hacker News stories, briefly explained.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff9a3d'/%3E%3Cstop offset='1' stop-color='%23ff5a00'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 8 25 22H7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500..800&family=Figtree:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400..600&display=swap">
  <script>
    try {
      var t = localStorage.getItem('hnbrief.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      ['hnbrief.look', 'hnbrief.dark'].forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="rail">
      <div class="rail-top">
        <a class="brand" href="./" aria-label="HN Brief, home">
          <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 3.5 13 12H3z"/></svg></span>
          <span class="wordmark">HN Brief</span>
        </a>
        <button class="theme-toggle" id="theme" type="button" data-mode="system" aria-label="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <mask id="moon-cut"><rect width="24" height="24" fill="#fff"/><circle class="cut" cx="17" cy="7" r="6" fill="#000"/></mask>
            <circle class="core" cx="12" cy="12" r="5.5" mask="url(#moon-cut)"/>
            <path class="half" d="M12 6.5a5.5 5.5 0 0 0 0 11z"/>
            <g class="rays"><path d="M12 1.5v2.2M12 20.3v2.2M1.5 12h2.2M20.3 12h2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></g>
          </svg>
        </button>
      </div>

      <p class="refresh" id="refresh">&nbsp;</p>

      <button class="sync" id="sync" type="button"></button>

      <section class="rail-section">
        <h2 class="rail-label">Topics</h2>
        <div class="topics" id="tags"></div>
      </section>

      <button class="topic archive-tab" id="archive-tab" type="button" aria-pressed="false"></button>
    </aside>

    <main class="feed">
      <header class="feed-head">
        <p class="eyebrow" id="feed-eyebrow"></p>
        <h1 id="feed-title">The week on Hacker News</h1>
      </header>
      <ol class="stories" id="stories"></ol>
      <footer class="colophon">
        Stories from <a href="https://news.ycombinator.com" target="_blank" rel="noopener">Hacker News</a>, refreshed hourly. Summaries by Gemini.
      </footer>
    </main>
  </div>

  <dialog class="welcome" id="welcome">
    <form id="welcome-form" class="welcome-card" method="dialog">
      <span class="mark mark-lg" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 3.5 13 12H3z"/></svg></span>
      <h2 id="welcome-title">Welcome to HN Brief</h2>
      <p id="welcome-text">Pick a passphrase to remember what you’ve read. Type it on any other device and stories you’ve finished stay gone.</p>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" data-mode="create" aria-selected="true">I’m new</button>
        <button type="button" role="tab" data-mode="signin" aria-selected="false">I have one</button>
      </div>
      <label class="visually-hidden" for="pass">Passphrase</label>
      <input id="pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" minlength="6" maxlength="200" placeholder="At least 6 characters" required>
      <button class="primary" id="welcome-go" type="submit">Create my passphrase</button>
      <p class="welcome-error" id="welcome-error" role="alert"></p>
      <button class="link" id="welcome-skip" type="button">Skip, just use this device</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
